# SPDX-License-Identifier: MIT

# Push vX.Y.Z to publish a Windows x64 release. The tag must match the version in CMakeLists.txt.
# Release notes come from docs/release-notes/X.Y.Z.md. The attached cafesf2-X.Y.Z-win-x64.zip
# contains cafesf2.exe, README.md, LICENSE and THIRD-PARTY-NOTICES.md.
#
# Manual runs (Actions > Release > Run workflow) upload the same ZIP as a workflow artifact without
# publishing a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Read the project version, check the tag if present, and require release notes.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - id: version
        uses: ./externals/xsflib/ci/release-version
        with:
          project: cafesf2

  windows:
    needs: version
    name: Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - uses: ./externals/xsflib/ci/release-windows
        with:
          version: ${{ needs.version.outputs.version }}
          cmake: -A x64 -T ClangCL
          targets: cafesf2
          programs: cafesf2
          files: build/Release/cafesf2.exe
          artifact: win-x64

  package:
    needs: [version, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - uses: ./externals/xsflib/ci/package-converter
        with:
          program: cafesf2
          version: ${{ needs.version.outputs.version }}

      - uses: ./externals/xsflib/ci/release-publish
        with:
          title: cafesf2
          version: ${{ needs.version.outputs.version }}
          artifact: cafesf2-${{ needs.version.outputs.version }}
